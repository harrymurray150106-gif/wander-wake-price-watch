name: Update prices

"on":
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  check-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run price checker
        run: python3 scripts/check_prices.py

      - name: Commit updated data (if anything changed)
        run: |
          git config user.name "price-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/snapshot.json data/history.json data/known_urls.json data/discovered_products.json data/last_run.json
          if git diff --cached --quiet; then
            echo "No price changes this run."
          else
            git commit -m "Update prices ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
